<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo Pasajero</title>

  <!-- Supabase CDN (Asegúrate de incluir la librería) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
    }

    .card h2 {
      text-align: center;
      margin-top: 0;
      color: #1a1a1a;
    }

    .card p.subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
      font-size: 0.9em;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #333;
      font-size: 0.9em;
      font-weight: bold;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.95em;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 0.95em;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-primary {
      background-color: #0d2366;
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #081640;
    }

    .btn-secondary {
      background-color: #e0e0e0;
      color: #333333;
    }

    .btn-secondary:hover {
      background-color: #d0d0d0;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🚖 Módulo Pasajero</h2>
    <p class="subtitle">Inicia sesión o regístrate como pasajero</p>

    <form id="passengerForm">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" placeholder="ejemplo@gmail.com" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="******" required>
      </div>

      <div class="form-group">
        <label for="fullName">Nombre y Apellido</label>
        <input type="text" id="fullName" placeholder="Ej. Jose Perez">
      </div>

      <div class="form-group">
        <label for="phone">Número de Teléfono</label>
        <input type="tel" id="phone" placeholder="04124567890">
      </div>

      <div class="button-group">
        <button type="button" id="btnLogin" class="btn btn-primary">Iniciar Sesión</button>
        <button type="button" id="btnRegister" class="btn btn-secondary">Registrarse</button>
      </div>
    </form>
  </div>

  <script>
    // Configuración de Supabase (Sustituye con tu URL y Key públicas)
    const SUPABASE_URL = 'TU_SUPABASE_URL';
    const SUPABASE_KEY = 'TU_SUPABASE_ANON_KEY';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Selección de elementos
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const fullNameInput = document.getElementById('fullName');
    const phoneInput = document.getElementById('phone');

    const btnLogin = document.getElementById('btnLogin');
    const btnRegister = document.getElementById('btnRegister');

    // 1. Lógica para Iniciar Sesión (Solo requiere Correo y Contraseña)
    btnLogin.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      if (!email || !password) {
        alert('Por favor, ingresa tu correo y contraseña para iniciar sesión.');
        return;
      }

      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        alert('Error al iniciar sesión: ' + error.message);
      } else {
        alert('¡Inicio de sesión exitoso!');
        // Redirección o lógica posterior al login
      }
    });

    // 2. Lógica para Registrarse (Requiere todos los datos)
    btnRegister.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      const fullName = fullNameInput.value.trim();
      const phone = phoneInput.value.trim();

      if (!email || !password || !fullName || !phone) {
        alert('Por favor, completa todos los campos para poder registrarte.');
        return;
      }

      const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            full_name: fullName,
            phone: phone,
            role: 'passenger'
          }
        }
      });

      if (error) {
        alert('Error al registrarse: ' + error.message);
      } else {
        alert('Registro exitoso. Revisa tu correo electrónico para confirmar la cuenta.');
      }
    });
  </script>

</body>
</html>
